<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Musketeers - Script</title>
<style>
  :root { --bg: #0e0f12; --bar: #1c1f25; --line: #323843; --text: #e8eaee; --dim: #8d95a3; --cue: #e0323c; --accent: #f2b33d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.35 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 7px 12px; background: var(--bar); border-bottom: 1px solid var(--line); flex: none; }
  #cur { font-weight: 700; font-size: 17px; color: #ff6b73; font-variant-numeric: tabular-nums; }
  #lbl { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  label { display: flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12.5px; white-space: nowrap; }
  select, button { background: #23272f; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12.5px; }
  #scroll { flex: 1; overflow-y: auto; padding: 12px 10px 60vh; }
  .half { position: relative; overflow: hidden; margin: 0 auto 10px; background: #fff; border-radius: 3px; max-width: var(--w, 820px); }
  .half.spread { aspect-ratio: 396 / 612; } .half.full { aspect-ratio: 612 / 792; }
  .half img { position: absolute; top: 0; height: 100%; display: block; }
  .half.spread img { width: 200%; } .half.full img { width: 100%; left: 0; }
  .tag { position: absolute; right: 6px; top: 6px; background: rgba(20,22,26,.7); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 10px; }
  .mark { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed rgba(224,50,60,.55); pointer-events: none; }
  .mark span { position: absolute; left: 0; bottom: 0; background: rgba(224,50,60,.75); color: #fff; font-weight: 700; font-size: 12px; padding: 1px 7px; border-radius: 0 4px 0 0; }
  .mark.cur { border-top: 3px solid var(--cue); } .mark.cur span { background: var(--cue); font-size: 14px; }
  .mark.next { border-top: 2px solid var(--accent); } .mark.next span { background: var(--accent); color: #2b1d00; }
  body.nomarks .mark { display: none; }
</style>
</head>
<body>
<header>
  <span id="cur">—</span><span id="lbl">Standby</span>
  <label>Go to <select id="jump"></select></label>
  <label><input type="checkbox" id="follow" checked> Follow cues</label>
  <label><input type="checkbox" id="marks" checked> Cue marks</label>
  <label>Size <select id="size"><option value="640px">S</option><option value="820px" selected>M</option><option value="1100px">L</option><option value="100%">Fit</option></select></label>
</header>
<div id="scroll"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let show, index = -1, first = true;

function build() {
  const pad = (n) => String(n).padStart(2, '0');
  let html = '';
  for (let p = 2; p <= show.pageCount; p++) {
    const sides = show.fullPages.includes(p) ? ['F'] : ['L', 'R'];
    for (const side of sides) {
      const marks = show.cues.map((c, i) => [c, i]).filter(([c]) => c.page === p && c.side === side)
        .map(([c, i]) => `<div class="mark" data-i="${i}" style="top:${c.y * 100 - 0.6}%"><span>${c.id}</span></div>`).join('');
      html += `<div class="half ${side === 'F' ? 'full' : 'spread'}" id="h${p}${side}"><img loading="lazy" src="pages/p${pad(p)}.jpg" style="left:${side === 'R' ? '-100%' : '0'}" alt="">${marks}<div class="tag">p.${p}${side === 'F' ? '' : side === 'L' ? ' left' : ' right'}</div></div>`;
    }
  }
  $('scroll').innerHTML = html;
  $('jump').innerHTML = show.scenes.map((s) => `<option value="${s.id}">${s.id} ${esc(s.title)}</option>`).join('');
}

function scrollToCue(i, smooth) {
  const m = document.querySelector(`.mark[data-i="${i}"]`);
  if (!m) return;
  const box = $('scroll');
  const top = m.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 80;
  box.scrollTo({ top: Math.max(0, top), behavior: smooth ? 'smooth' : 'auto' });
}

function update(i) {
  const changed = i !== index;
  index = i;
  const cue = show.cues[i];
  $('cur').textContent = cue ? cue.id : '—';
  $('lbl').textContent = cue ? cue.label : 'Standby';
  document.querySelectorAll('.mark').forEach((m) => {
    m.classList.toggle('cur', +m.dataset.i === i);
    m.classList.toggle('next', +m.dataset.i === i + 1);
  });
  if (cue) $('jump').value = cue.scene;
  if ((changed || first) && cue && $('follow').checked) { const smooth = !first && !document.hidden; setTimeout(() => scrollToCue(i, smooth), 0); }
  first = false;
}

$('jump').onchange = () => { $('follow').checked = false; scrollToCue(show.cues.findIndex((c) => c.scene === $('jump').value), false); };
$('follow').onchange = () => { if ($('follow').checked && index >= 0) scrollToCue(index, true); };
$('marks').onchange = () => document.body.classList.toggle('nomarks', !$('marks').checked);
$('size').onchange = () => document.documentElement.style.setProperty('--w', $('size').value);

fetch('/api/show').then((r) => r.json()).then((s) => {
  show = s; build();
  new EventSource('/events').onmessage = (e) => update(JSON.parse(e.data).index);
});
</script>
</body>
</html>
